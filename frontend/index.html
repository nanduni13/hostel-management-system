<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Hostel Management System</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <h1>🏠 Hostel Management System</h1>

  <section id="studentsSection">
    <h2>Students</h2>
    <form id="studentForm">
      <input type="text" id="studentName" placeholder="Name" required>
      <input type="number" id="studentAge" placeholder="Age" required>
      <input type="text" id="studentDept" placeholder="Department" required>
      <button type="submit">Add Student</button>
    </form>
    <table id="studentsTable">
      <thead>
        <tr><th>Name</th><th>Age</th><th>Department</th><th>Fees Paid</th></tr>
      </thead>
      <tbody></tbody>
    </table>
  </section>

  <section id="roomsSection">
    <h2>Rooms</h2>
    <form id="roomForm">
      <input type="text" id="roomNo" placeholder="Room No" required>
      <input type="number" id="capacity" placeholder="Capacity" required>
      <button type="submit">Add Room</button>
    </form>
    <table id="roomsTable">
      <thead>
        <tr><th>Room No</th><th>Capacity</th><th>Status</th></tr>
      </thead>
      <tbody></tbody>
    </table>
  </section>

  <section id="adminsSection">
    <h2>Admins</h2>
    <form id="adminForm">
      <input type="text" id="adminUser" placeholder="Username" required>
      <input type="password" id="adminPass" placeholder="Password" required>
      <button type="submit">Add Admin</button>
    </form>
    <table id="adminsTable">
      <thead>
        <tr><th>Username</th><th>Role</th></tr>
      </thead>
      <tbody></tbody>
    </table>
  </section>

  <!-- JS Modules -->
  <script type="module" src="js/students.js"></script>
  <script type="module" src="js/rooms.js"></script>
  <script type="module" src="js/admins.js"></script>
</body>
</html>
